services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    env_file:
    - postgres.env
    - postgres.secret.env
  redis:
    image: redis
    ports:
      - 6379:6379
  cassandra:
    image: cassandra
    ports:
      - 9042:9042
  kafka:
    image: apache/kafka
    env_file:
      - kafka.env
    ports:
      - 9092:9092
      - 29092:29092
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8089:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    volumes:
      - ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml
  app:
    build: ../