services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    env_file:
    - postgres.env
    - postgres.secret.env
  redis:
    image: redis
    ports:
      - 6379:6379
  cassandra:
    image: cassandra
    ports:
      - 9042:9042
  kafka:
    image: apache/kafka
  app:
    build: ../