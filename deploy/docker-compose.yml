services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    env_file:
    - postgres.env
    - postgres.secret.env
  redis:
    image: redis
    ports:
      - 6379:6379
  cassandra:
    image: cassandra
    ports:
      - 9042:9042
  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
  app:
    build: ../
    env_file:
      - postgres.secret.env
      - app.env
    ports:
      - 8080:8080