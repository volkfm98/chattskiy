services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    env_file:
    - postgres.env
    - postgres.secret.env
  redis:
    image: redis
    ports:
      - 6379:6379
  cassandra:
    image: cassandra
    ports:
      - 9042:9042
    ports:
    volumes:
      - ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml
  app:
    build: ../
    env_file:
      - postgres.secret.env
      - app.env
    ports:
      - 8080:8080